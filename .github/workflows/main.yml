name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            mkdir -p _p && unzip -q -o "$ZIP" -d _p
            echo "PROJ=_p" >> "$GITHUB_ENV"
          elif [ -f build.gradle ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            echo "No project zip found. Upload the project zip to the repo root."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Bundle web libraries (optional)
        run: bash "$PROJ/scripts/vendor.sh" || true

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VakilYar-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
